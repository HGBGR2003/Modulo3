<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário do Brabo</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styleFormulario.css">
</head>
<body>
    <main>
        <div class="form-header">
            <span class="tag">Cadastro</span>
            <h1>Formulário <em>do Brabo</em></h1>
            <p>Preencha os campos abaixo para prosseguir.</p>
        </div>

        <form action="proximo.html" method="get">
            <div class="form-card">

                <div class="form-group">
                    <label for="input-nome">Nome do Usuário</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input id="input-nome" type="text" name="nome" placeholder="Digite seu nome aqui" autocomplete="name">
                    </div>
                    <div class="field-msg" id="msg-nome">Por favor, insira seu nome.</div>
                </div>

                <div class="form-group">
                    <label for="input-senha">Senha</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input id="input-senha" type="password" name="senha" placeholder="Digite sua senha" autocomplete="new-password">
                        <button type="button" class="toggle-pw" id="toggleSenha" aria-label="Mostrar/ocultar senha">👁️</button>
                    </div>
                    <div class="field-msg" id="msg-senha">A senha deve ter ao menos 6 caracteres.</div>
                </div>

                <div class="form-group">
                    <label for="input-data">Data</label>
                    <div class="input-wrap">
                        <span class="icon">📅</span>
                        <input id="input-data" type="date" name="data">
                    </div>
                    <div class="field-msg" id="msg-data">Selecione uma data válida.</div>
                </div>

                <hr class="divider">

                <div class="form-group">
                    <label for="input-peso">Peso (kg)</label>
                    <div class="input-wrap">
                        <span class="icon">⚖️</span>
                        <input id="input-peso" type="number" name="peso" placeholder="Ex: 72.5" min="1" max="500" step="0.1">
                    </div>
                    <div class="field-msg" id="msg-peso">Insira um peso válido (1–500 kg).</div>
                </div>

            </div>

            <div class="btn-row">
                <a href="index.html" class="btn btn-back">← Voltar</a>
                <button href="proximo.html" type="submit" class="btn btn-next">Prosseguir</button>
            </div>
        </form>
    </main>

</body>
</html>
